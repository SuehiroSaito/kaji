<html>
<body>

<p>
    ここに、コンテンツ、いろいろ。
</p>

<button id="btn01">JavaScript開始ボタン</button>

<div id="msg01"></div>

<script>
    // JavaScriptのコードは、ここに書きます。
    const btn01 = document.getElementById('btn01');
    const msg01 = document.getElementById('msg01');

    btn01.addEventListener('click', () => {
        msg01.textContent = 'Hello';
    });
</script>

</body>
</html>
