<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3/brython.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3/brython_stdlib.js"></script>
</head>
<body onload="brython()">
<button id="button_01">ボタン 01</button>
<button id="button_02">ボタン 02</button>

<script type="text/python">
from browser import document
from browser.widgets.dialog import InfoDialog

def hello(ev):
    InfoDialog("Brython", "Hello, Brython!")

document["button_01"].bind("click", hello)

</script>
<script>

document.getElementById("button_02").addEventListener("click", function(ev) {
        alert("Hello, JavaScript!");
});

</script>

</body>
</html>
