<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3/brython.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3/brython_stdlib.js"></script>
</head>
<body onload="brython()">
<button id="button_01">Brython</button><button id="button_02">JavaScript</button>

<div id="container" style="margin-top: 10px;"></div>

<!-- Brython 側のスクリプト -->
<script type="text/python">
from browser import document, html

def render_cards(ev):
    container = document["container"]
    container.clear()
    
    items = [
        {"title": "ベリー", "tag": "果物"},
        {"title": "人参", "tag": "野菜"},
    ]
    
    cards = [
        html.DIV([
            html.H4(item["title"]),
            html.SPAN(item["tag"])
        ], style={
            "border": "1px solid #ccc",
            "width": "200px"
        })
        for item in items
    ]

    container <= cards

document["button_01"].bind("click", render_cards)
</script>

<!-- JavaScript側のスクリプト -->
<script>
document.getElementById("button_02").addEventListener("click", function(ev) {
    const container = document.getElementById("container");
    container.innerHTML = "";
    
    const items = [
        {title: "ナツメ", tag: "果物"},
        {title: "大根", tag: "野菜"}
    ];
    
    items.forEach(item => {    //forEach 関数でループを表現
        const card = document.createElement("div");
        card.style.border = "1px solid #ccc";
        card.style.width = "200px";
        
        const h4 = document.createElement("h4");
        h4.textContent = item.title;
        card.appendChild(h4);
        
        const span = document.createElement("span");
        span.textContent = item.tag;
        card.appendChild(span);
        
        container.appendChild(card);
    });
});
</script>
</body>
</html>
