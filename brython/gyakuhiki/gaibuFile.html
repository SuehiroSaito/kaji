<!DOCTYPE html>
<html>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3/brython.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3/brython_stdlib.js"></script>
</head>
<body onload="brython()">

<button id="button_01">Brython</button>
<button id="button_02">JavaScript</button>

<!-- Brython 側のダイアログ用外部スクリプト -->
<script type="text/python" src="gaibuFile.py"></script>

    <p>お名前を入力してください：</p>
    <input type="text" id="jsInput" style="margin-bottom: 10px;"><br>

    <button id="jsClose">閉じる</button>

<!-- JavaScript側の外部スクリプト -->
<script src="gaibuFile.js"></script>
